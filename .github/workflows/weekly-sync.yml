name: weekly-sync
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull upstream catalogs
        run: pnpm sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Motion signals for new entries
        run: pnpm scan-motion
      - run: pnpm generate
      - run: pnpm check
      - name: Summarise changes
        run: |
          {
            echo "Automated weekly pull of upstream component catalogs (\`pnpm sync && pnpm generate\`)."
            echo
            pnpm exec tsx scripts/catalog-diff.ts HEAD
          } > /tmp/pr-body.md
          cat /tmp/pr-body.md
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/weekly-catalog-sync
          delete-branch: true
          title: "chore: weekly catalog sync"
          commit-message: "chore: weekly catalog sync"
          body-path: /tmp/pr-body.md
          labels: catalog-sync
