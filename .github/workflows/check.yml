name: check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - name: Generated files are committed
        run: git diff --exit-code -- . ':!public/r' || (echo "Run pnpm generate and commit the result." && exit 1)
      - run: pnpm check
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec tsx scripts/check-tracing.ts
      - name: Browser-test visual galleries
        run: |
          pnpm start -p 3330 > /tmp/design-infra-gallery.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --location http://localhost:3330/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm smoke:visual --base http://localhost:3330
          pnpm smoke:landing --base http://localhost:3330
          pnpm smoke:requests --base http://localhost:3330
          pnpm smoke:motion --base http://localhost:3330
          pnpm smoke:hosting --base http://localhost:3330
