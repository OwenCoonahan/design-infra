name: Bug or failed setup
description: Report a broken search, preview, connection or installation
body:
  - type: textarea
    id: report
    attributes:
      label: Feedback report
      description: Paste the report from the hosted /feedback page. Include query, component, stack and outcome; omit secrets and private code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
